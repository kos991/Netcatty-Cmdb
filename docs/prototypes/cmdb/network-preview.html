<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="record-theme-preview.js"></script>
<title>网络 · 机柜与网络 · 设计原型</title>
<link rel="stylesheet" href="cmdb-preview.css">
<link rel="stylesheet" href="cmdb-settings-preview.css">
<link rel="stylesheet" href="cmdb-settings-catalog-preview.css">
<link rel="stylesheet" href="cmdb-settings-operations-preview.css">
<script src="cabinet-network-nav-preview.js" defer></script>
<link rel="stylesheet" href="address-pool-preview.css">
<link rel="stylesheet" href="record-shell-preview.css">
</head>
<body class="ip-review-active">
<script src="vendor/netcatty-icons.js"></script>
<script src="cmdb-settings-data-preview.js"></script>
<script src="cmdb-settings-catalog-preview.js"></script>
<script src="cmdb-settings-operations-preview.js"></script>
<script src="cmdb-settings-preview.js"></script>
<div class="app">
<div class="tabs"><span class="tab">▧&nbsp; Vaults</span><span class="tab active"><svg><use href="#server"/></svg>Cmdb</span><span class="tab">▱&nbsp; SFTP</span><span class="tab">＋</span><div class="window-actions"><svg><use href="#settings"/></svg><span>—</span><span>□</span><span>×</span></div></div>
<div class="shell">
<nav class="rail" aria-label="工作区"><div class="logo">N</div><button aria-label="设备资产" title="设备资产" onclick="location.href='device-assets-preview.html#terminal'"><svg><use href="#monitor"/></svg></button><button aria-label="组织架构" title="组织架构" onclick="location.href='organization-preview.html'"><svg><use href="#people"/></svg></button><button class="selected" aria-label="机柜与网络" title="机柜与网络"><svg><use href="#router"/></svg></button><button aria-label="工单与统计" title="工单与统计" onclick="location.href='work-order-preview.html'"><svg><use href="#chart"/></svg></button></nav>
<main class="surface">
<header id="pool-toolbar" class="toolbar" aria-label="地址池工具栏">
  <details class="new-menu"><summary class="primary" aria-label="新增地址池" title="新增地址池"><svg><use href="#plus"/></svg>新增地址池 <span class="chevron">⌄</span></summary><div class="menu"><button data-pool-editor="new">新增地址池</button><button data-pool-editor="browse">维护其他地址池</button><button disabled>从资产 IP 生成</button><small>新增为空白表单；维护可在左侧切换地址池</small></div></details>
  <details class="pool-selector"><summary aria-label="选择地址池"><span id="pool-choice"></span><span class="chevron">⌄</span></summary><div class="menu"><input id="pool-find" aria-label="搜索地址池" placeholder="搜索地址池名称、CIDR"><div id="pool-options"></div><button type="button" id="pool-selector-edit" class="pool-selector-edit">编辑当前地址池</button></div></details>
  <label class="search"><svg><use href="#search"/></svg><input id="pool-search" aria-label="查询 IP 或资产" placeholder="查询 IP、资产名称"></label>
  <div id="pool-filters" class="pool-filters" hidden><label>状态<select id="pool-filter-status"><option value="">全部状态</option><option value="free">空闲</option><option value="reserved">已预留</option><option value="used">已占用</option></select></label><label>分段<select id="pool-filter-segment"><option value="all">全部分段</option></select></label></div>
  <div class="toolbar-actions">
    <details class="pool-transfer toolbar-transfer"><summary class="icon toolbar-icon" aria-label="导入/导出 IP" title="导入/导出 IP"><svg aria-hidden="true"><use href="#transfer"/></svg></summary><div class="menu"><button disabled><svg><use href="#upload"/></svg>导入 IP</button><button disabled><svg><use href="#download"/></svg>按当前条件导出</button><small>设计原型，不读写业务文件</small></div></details>
  </div>
</header>
<section id="pool-content" class="pool-view" aria-label="网络地址池">
  <div class="pool-summary">
    <div class="pool-identity"><h1 id="pool-heading"></h1><span id="pool-metadata"></span><div id="pool-segment-overview" class="ip-segment-overview" role="group" aria-label="地址分段筛选"></div></div>
  </div>
  <div id="pool-address-layout" class="pool-address-layout">
  <div class="pool-scroll">
    <div id="ip-grid" class="ip-grid"></div>
    <table id="ip-table" class="ip-table" hidden><thead><tr><th scope="col">IP 地址</th><th scope="col">部门 / 楼层</th><th scope="col">网络类型</th><th scope="col">状态</th><th scope="col">占用设备</th><th scope="col">位置</th></tr></thead><tbody id="ip-table-body"></tbody></table>
    <p id="pool-empty" class="pool-empty" hidden>没有匹配地址</p>
  </div>
  </div>
  <footer class="pool-pager">
    <span id="pool-page-count" class="count"></span>
    <button type="button" class="pool-stat" data-pool-status="" aria-pressed="true" title="恢复全部状态，保留搜索与分段条件"><svg aria-hidden="true"><use href="#database"/></svg><span>地址总数</span><strong id="pool-total"></strong></button>
    <button type="button" class="pool-stat used" data-pool-status="used" aria-pressed="false" title="筛选已占用，再次点击取消"><span class="ip-status-dot" aria-hidden="true"></span><span>已占用</span><strong id="pool-used"></strong></button>
    <button type="button" class="pool-stat reserved" data-pool-status="reserved" aria-pressed="false" title="筛选已预留，再次点击取消"><svg aria-hidden="true"><use href="#lock"/></svg><span>已预留</span><strong id="pool-reserved"></strong></button>
    <button type="button" class="pool-stat free" data-pool-status="free" aria-pressed="false" title="筛选空闲，再次点击取消"><svg aria-hidden="true"><use href="#check"/></svg><span>空闲</span><strong id="pool-free"></strong></button>
    <button type="button" class="pool-stat abnormal" data-pool-status="abnormal" aria-pressed="false" title="筛选异常，再次点击取消"><span class="ip-status-alert" aria-hidden="true">!</span><span>异常</span><strong id="pool-abnormal"></strong></button>
    <div class="pool-page-actions"><select id="pool-page-size" aria-label="每页地址数"><option value="96">96 条 / 页</option><option value="128">128 条 / 页</option><option value="256" selected>256 条 / 页</option></select><button id="pool-prev">上一页</button><button id="pool-next">下一页</button></div>
  </footer>
</section>
<dialog id="ip-detail" class="record-shell record-dialog" aria-labelledby="ip-detail-title">
  <header class="dialog-header record-header"><div class="ip-detail-identity"><div class="ip-detail-title-row"><h2 id="ip-detail-title"></h2><span id="ip-detail-status" class="ip-detail-status"></span></div><p id="ip-detail-subtitle" class="ip-detail-subtitle"></p></div><button id="ip-detail-close" type="button" class="icon quiet" aria-label="关闭 IP 详情"><svg><use href="#close"/></svg></button></header>
  <div class="dialog-body record-body"><section class="record-section"><h3 class="section-title">归属信息</h3><dl id="ip-detail-fields" class="ip-definition record-fields"></dl></section><section class="record-section"><h3 class="section-title">当前使用</h3><dl id="ip-detail-usage" class="ip-definition record-fields"></dl></section><p class="dialog-note ip-detail-disclaimer">示例数据，仅用于离线预览。</p></div>
  <footer class="dialog-footer record-footer"><button id="ip-relocate" type="button" class="primary">定位地址</button><span id="ip-detail-actions"></span></footer>
</dialog>
<dialog id="pool-editor" class="pool-maintenance record-shell record-dialog" aria-labelledby="pool-editor-title">
  <header class="dialog-header record-header"><h2 id="pool-editor-title"></h2><button class="icon quiet" data-close="pool-editor" aria-label="关闭地址池维护">×</button></header>
  <div class="pool-maintenance-body">
    <aside class="pool-maintenance-directory">
      <label class="pool-editor-search"><svg aria-hidden="true"><use href="#search"/></svg><input id="pool-editor-find" type="search" aria-label="搜索地址池" placeholder="搜索地址池名称、CIDR"></label>
      <div id="pool-editor-list" class="pool-editor-list" role="listbox" aria-label="地址池列表"></div>
    </aside>
    <div class="dialog-body record-body"><section class="record-section"><h3 class="section-title">地址池资料</h3><div class="fields record-fields">
      <p id="pool-editor-scope" class="field full"></p>
      <div class="field full"><label for="pool-name">地址池名称</label><input id="pool-name" placeholder="例如：办公内网"></div>
      <div class="field"><label for="pool-category">网络类型</label><select id="pool-category"><option>内网</option><option>专网</option><option>外网</option></select></div>
      <div class="field"><label for="pool-cidr">CIDR</label><input id="pool-cidr" placeholder="192.168.10.0/24"></div>
      <div class="field"><label for="pool-gateway">网关</label><input id="pool-gateway"></div>
      <div class="field"><label for="pool-vlan">VLAN</label><input id="pool-vlan"></div>
      <div class="field"><label for="pool-vni">VXLAN VNI</label><input id="pool-vni"></div>
      <div class="field full"><label for="pool-purpose">用途</label><input id="pool-purpose"></div>
    </div></section><section class="record-section"><div class="pool-segment-title"><h3 class="section-title">地址分段</h3><div class="pool-segment-actions"><button type="button" id="pool-segment-remark" class="quiet">⚡按备注生成</button><button type="button" id="pool-segment-add" class="primary">＋ 新增分段</button></div></div><p class="dialog-note">按部门和楼层划分 CIDR 内的 IP 范围，数量自动计算。</p><div id="pool-segment-editor"></div></section><p id="pool-segment-error" class="dialog-note" role="alert"></p></div>
  </div>
  <footer class="dialog-footer record-footer"><button data-close="pool-editor">关闭</button><button id="pool-editor-save" class="primary" type="button">保存预览</button></footer>
</dialog>
<dialog id="pool-ip-editor" class="record-shell record-dialog" aria-labelledby="pool-ip-editor-title">
  <header class="dialog-header record-header"><h2 id="pool-ip-editor-title">补录 IP</h2><button class="icon quiet" data-close="pool-ip-editor" aria-label="关闭补录 IP">×</button></header>
  <div class="dialog-body record-body"><section class="record-section"><h3 class="section-title">地址资料</h3><div class="fields record-fields"><div class="field full"><label for="new-ip-address">IP 地址</label><input id="new-ip-address" placeholder="填写当前地址池内的地址"></div><div class="field full"><label for="new-ip-note">备注</label><input id="new-ip-note"></div></div></section><p class="dialog-note">仅展示补录表单，不新增真实地址。</p></div>
  <footer class="dialog-footer record-footer"><button data-close="pool-ip-editor">关闭</button><button class="primary" disabled>确认补录</button></footer>
</dialog>
<div class="prototype-label">设计原型 · 示例数据 · 不连接业务服务</div>
</main>
</div>
</div>
<script src="vendor/animejs-4.5.0.umd.min.js"></script>
<script src="address-pool-preview.js"></script>
</body>
</html>
