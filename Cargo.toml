[workspace]
members = ["crates/cmdb-desktop", "crates/cmdb-engine"]
resolver = "2"

[workspace.package]
version = "1.0.202610221542"
edition = "2021"
authors = ["Cmdb Team"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
blenderui = { version = "=0.4.1", features = ["gdi-text"] }
[profile.release]
opt-level = 2
lto = "thin"
