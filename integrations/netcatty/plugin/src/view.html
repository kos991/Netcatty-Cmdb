<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMDB</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #283548; }
    h1 { margin: 0; font-size: 18px; }
    nav { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #283548; }
    button, input { color: inherit; background: #1f2937; border: 1px solid #3b4a60; border-radius: 5px; padding: 7px 10px; }
    button { cursor: pointer; }
    button.active { background: #2563eb; border-color: #3b82f6; }
    main { padding: 16px 20px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid #283548; }
    th { color: #93c5fd; font-weight: 600; }
    .muted { color: #9ca3af; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <header><h1>CMDB 资产管理</h1><span id="status" class="muted">准备就绪</span></header>
  <nav>
    <button data-tab="search" class="active">全局查询</button>
    <button data-tab="assets">资产</button>
    <button data-tab="ip_pool">IP 规划池</button>
    <button data-tab="dashboard">概览</button>
  </nav>
  <main>
    <div class="toolbar"><input id="keyword" placeholder="搜索资产名称、IP、负责人" /><button id="search">查询</button></div>
    <div id="content" class="muted">正在加载…</div>
  </main>
  <script>
    const view = window.netcattyView;
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    let active = 'search';
    let seq = 0;
    const requests = new Map();
    const esc = (value) => String(value ?? '').replace(/[&<>\"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]));
    const request = (action) => new Promise((resolve) => {
      const requestId = `cmdb-${++seq}`;
      requests.set(requestId, resolve);
      view.postMessage({ requestId, action, keyword: document.getElementById('keyword').value });
    });
    view.onDidReceiveMessage((message) => {
      if (!message || !requests.has(message.requestId)) return;
      const resolve = requests.get(message.requestId); requests.delete(message.requestId); resolve(message);
    });
    function render(result) {
      if (!result.ok) { content.innerHTML = `<p class="error">${esc(result.error)}</p>`; status.textContent = '连接失败'; return; }
      const payload = result.payload || {};
      const rows = active === 'search' ? (payload.results || []) : active === 'assets' ? (payload.list || []) : (payload.list || payload.assets || []);
      if (!rows.length) { content.innerHTML = '<p class="muted">暂无数据</p>'; status.textContent = '已连接'; return; }
      const keys = active === 'search' ? ['kind','title','subtitle'] : active === 'assets' ? ['name','asset_code','status','owner','manage_ip','biz_ip'] : ['ip','subnet','status','account','department','room'];
      content.innerHTML = `<table><thead><tr>${keys.map((key) => `<th>${esc(key)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${keys.map((key) => `<td>${esc(row[key])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      status.textContent = `已加载 ${rows.length} 条`;
    }
    async function load() { status.textContent = '查询中…'; render(await request(active)); }
    document.querySelectorAll('[data-tab]').forEach((button) => button.addEventListener('click', () => { document.querySelectorAll('[data-tab]').forEach((item) => item.classList.remove('active')); button.classList.add('active'); active = button.dataset.tab; load(); }));
    document.getElementById('search').addEventListener('click', load);
    load();
  </script>
</body>
</html>
