name: Release

# 发布只由 main 上合并后的 v1.0.YYYYMMDD tag 触发，只产出 Windows 集成客户端。
# 发布说明按自上个 tag 以来合并的 PR 自动汇总（修复 / 新功能），见 .github/release.yml。
on:
  push:
    tags: ["v*"]

# 直接在构建任务里上传到 Release，不经过 Actions 制品存储，避免占用制品配额。
permissions:
  contents: write

jobs:
  netcatty-windows:
    name: Integrated Netcatty for Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version and main ancestry
        shell: pwsh
        run: |
          node scripts/check-version.mjs --tag "$env:GITHUB_REF_NAME"
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) { throw "发布 tag 必须指向已合并到 main 的提交" }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test backend
        # Windows runner 上 internal/store 的 SQLite 迁移测试会超过 Go 默认 10 分钟超时（本地约 4.5 分钟）。
        run: go test -count=1 -timeout 30m ./...
      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build embedded CMDB server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          # 版本只来自真实发布 tag，供设置页 Cmdb 版本入口显示。
          go build -trimpath -ldflags="-s -w -X main.version=$env:GITHUB_REF_NAME" -o build/cmdb-server.exe .
          node scripts/check-release-data.mjs build/cmdb-server.exe
      - name: Checkout and integrate Netcatty
        shell: pwsh
        run: |
          $upstream = Get-Content integrations/netcatty/upstream.json | ConvertFrom-Json
          git clone --filter=blob:none $upstream.repository build/netcatty
          git -C build/netcatty checkout $upstream.commit
          node scripts/prepare-netcatty.mjs --target build/netcatty
          $version = (Get-Content VERSION -Raw).Trim()
          Push-Location build/netcatty
          npm.cmd install
          npm.cmd version $version --no-git-tag-version
          $env:MOSH_BIN_RELEASE = $upstream.moshRelease
          $env:ET_BIN_OWNER = $upstream.etOwner
          $env:ET_BIN_RELEASE = $upstream.etRelease
          node scripts/fetch-mosh-binaries.cjs --host
          node scripts/fetch-et-binaries.cjs --host
          Pop-Location
      - name: Write Cmdb build info
        shell: pwsh
        run: |
          $upstream = Get-Content integrations/netcatty/upstream.json | ConvertFrom-Json
          [ordered]@{
            cmdbVersion = (Get-Content VERSION -Raw).Trim()
            upstreamRelease = $upstream.release
            upstreamCommit = $upstream.commit
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM build/build-info.json
      - name: Build Windows installer and update metadata
        shell: pwsh
        working-directory: build/netcatty
        env:
          NETCATTY_CMDB_SERVER_SOURCE: ${{ github.workspace }}\build\cmdb-server.exe
          NETCATTY_CMDB_BUILD_INFO: ${{ github.workspace }}\build\build-info.json
        run: |
          npm.cmd run build
          node ..\..\scripts\check-release-data.mjs ..\cmdb-server.exe .
          # 只发 NSIS：便携版不能自动升级，体积与安装包相同。
          npx.cmd electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish=never
      - name: Check Netcatty release data
        shell: pwsh
        run: node scripts/check-release-data.mjs build/netcatty/release
      - name: Build offline Cmdb patch
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          node scripts/build-cmdb-patch.mjs build/netcatty/release/win-unpacked build/build-info.json "build/netcatty/release/Netcatty-Cmdb-patch-$version-win-x64.zip"
      - name: Generate checksums
        shell: pwsh
        working-directory: build/netcatty/release
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -match '\.(exe|blockmap|zip)$' -or $_.Name -eq 'latest.yml' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding utf8 SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/netcatty/release/*.exe
            build/netcatty/release/*.blockmap
            build/netcatty/release/*.zip
            build/netcatty/release/latest.yml
            build/netcatty/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
