name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmdb:
    name: CMDB build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check version consistency
        run: node scripts/check-version.mjs
      - name: Test release data scanner
        run: node --test scripts/check-release-data.test.mjs
      - name: Build Ant Design frontend
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test -race -count=1 ./...
      - name: Build CMDB server
        run: mkdir -p build && go build -trimpath -o build/cmdb-server.exe .
      - name: Check CMDB release data
        run: node scripts/check-release-data.mjs build/cmdb-server.exe

  tools:
    name: Probes and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify probes and Python entry points
        run: |
          bash -n probes/uos_probe.sh
          bash -n probes/kylin_probe.sh
          bash probes/test_probes.sh
          python -m py_compile cli/cmdb_cli.py netcatty/host_sync.py
          python cli/cmdb_cli.py --help
          python netcatty/host_sync.py --help

  netcatty-integration:
    name: Netcatty integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout pinned Netcatty source
        run: |
          repository=$(node -p "require('./integrations/netcatty/upstream.json').repository")
          commit=$(node -p "require('./integrations/netcatty/upstream.json').commit")
          git clone --filter=blob:none "$repository" build/netcatty
          git -C build/netcatty checkout "$commit"
      - name: Apply CMDB integration
        run: node scripts/prepare-netcatty.mjs --target build/netcatty
      - name: Install Netcatty dependencies
        working-directory: build/netcatty
        run: npm install --ignore-scripts
      - name: Verify service lifecycle and native bridge
        working-directory: build/netcatty
        run: node --test electron/cmdbService.test.cjs electron/bridges/cmdbBridge.test.cjs
      - name: Lint integrated source
        working-directory: build/netcatty
        run: npm run lint
      - name: Build integrated Netcatty
        working-directory: build/netcatty
        run: npm run build
