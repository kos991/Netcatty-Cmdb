name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

      - name: Verify Web Dist Artifacts
        run: test -f web/dist/index.html

  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Build Web Assets
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          cd web
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          cache: true

      - name: Run Backend Unit Tests
        run: go test -v -race -count=1 ./...

      - name: Build CMDB Server Executable
        run: go build -v -o cmdb-server .

      - name: Verify Server Executable
        run: test -f cmdb-server

  probes-and-cli:
    name: Probes & Netcatty CLI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Shell Probes Syntax
        run: |
          bash -n probes/uos_probe.sh
          bash -n probes/kylin_probe.sh
          bash probes/test_probes.sh

      - name: Verify Python CLI Syntax & Commands
        run: |
          python -m py_compile cli/cmdb_cli.py
          python -m py_compile netcatty/host_sync.py
          python cli/cmdb_cli.py --help
          python netcatty/host_sync.py --help
